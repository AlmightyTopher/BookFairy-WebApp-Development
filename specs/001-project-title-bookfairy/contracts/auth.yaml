openapi: 3.0.3
info:
  title: BookFairy Authentication API
  description: Authentication endpoints for Google OAuth and user management
  version: 1.0.0

paths:
  /auth/google:
    post:
      summary: Initiate Google OAuth flow
      description: Redirects user to Google OAuth consent screen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_url:
                  type: string
                  format: uri
                  description: URL to redirect after successful authentication
              required:
                - redirect_url
      responses:
        '302':
          description: Redirect to Google OAuth
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/callback:
    post:
      summary: Handle Google OAuth callback
      description: Process OAuth code and create user session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: OAuth authorization code
                state:
                  type: string
                  description: CSRF protection state parameter
              required:
                - code
                - state
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  session:
                    $ref: '#/components/schemas/Session'
                  requires_onboarding:
                    type: boolean
                    description: Whether user needs to complete onboarding
        '400':
          description: Invalid OAuth code or state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/user:
    get:
      summary: Get current user profile
      description: Retrieve authenticated user's profile and settings
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update user profile
      description: Update user preferences and settings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                hardcover_api_key:
                  type: string
                  description: User's Hardcover API key
                accessibility_preferences:
                  $ref: '#/components/schemas/AccessibilitySettings'
                theme_preferences:
                  $ref: '#/components/schemas/ThemePreference'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Invalid update data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      summary: Logout user
      description: Invalidate user session and clear authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logout successful"
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        avatar_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
      required:
        - id
        - email
        - name

    Session:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token
        refresh_token:
          type: string
          description: JWT refresh token
        expires_at:
          type: string
          format: date-time
      required:
        - access_token
        - expires_at

    UserProfile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            hardcover_api_key:
              type: string
              description: User's Hardcover API key
            audiobookshelf_account_id:
              type: string
              description: Auto-created Audiobookshelf account
            onboarding_completed:
              type: boolean
            next_renewal_date:
              type: string
              format: date-time
            accessibility_preferences:
              $ref: '#/components/schemas/AccessibilitySettings'
            theme_preferences:
              $ref: '#/components/schemas/ThemePreference'

    AccessibilitySettings:
      type: object
      properties:
        prefers_reduced_motion:
          type: boolean
        high_contrast_enabled:
          type: boolean
        keyboard_navigation_enabled:
          type: boolean
        screen_reader_optimized:
          type: boolean
        font_size_multiplier:
          type: number
          minimum: 0.8
          maximum: 2.0

    ThemePreference:
      type: object
      properties:
        theme_mode:
          type: string
          enum: [light, dark, system]
        auto_switch_enabled:
          type: boolean

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error type identifier
        message:
          type: string
          description: Human-readable error message
        fairy_message:
          type: string
          description: Error message in BookFairy's voice for UI display
      required:
        - error
        - message