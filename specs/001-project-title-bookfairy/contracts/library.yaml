openapi: 3.0.3
info:
  title: BookFairy Library Management API
  description: Wishlist queue management and library tracking functionality
  version: 1.0.0

paths:
  /library/wishlist:
    get:
      summary: Get user's wishlist
      description: Retrieve wishlist items with queue status and expiration info
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by wishlist item status
          schema:
            type: string
            enum: [pending, processing, expired, fulfilled]
        - name: include_expired
          in: query
          description: Include expired items in results
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: User's wishlist
          content:
            application/json:
              schema:
                type: object
                properties:
                  wishlist_items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WishlistItem'
                  queue_info:
                    $ref: '#/components/schemas/QueueInfo'
                  fairy_status:
                    type: string
                    description: BookFairy's commentary on wishlist status
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      summary: Add book to wishlist
      description: Add a new book to the user's wishlist queue
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                book_id:
                  type: string
                  format: uuid
                  description: ID of the book to add
                priority:
                  type: integer
                  minimum: 1
                  description: Optional priority for queue positioning
              required:
                - book_id
      responses:
        '201':
          description: Book added to wishlist
          content:
            application/json:
              schema:
                type: object
                properties:
                  wishlist_item:
                    $ref: '#/components/schemas/WishlistItem'
                  queue_position:
                    type: integer
                    description: Position in the queue
                  fairy_response:
                    type: string
                    description: BookFairy's confirmation message
        '400':
          description: Invalid book ID or already in wishlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /library/wishlist/{wishlist_item_id}:
    delete:
      summary: Remove item from wishlist
      description: Remove a book from the user's wishlist
      security:
        - BearerAuth: []
      parameters:
        - name: wishlist_item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Item removed from wishlist
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  fairy_response:
                    type: string
        '404':
          description: Wishlist item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      summary: Update wishlist item
      description: Update priority or retry expired item
      security:
        - BearerAuth: []
      parameters:
        - name: wishlist_item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                priority:
                  type: integer
                  minimum: 1
                  description: New queue priority
                retry_expired:
                  type: boolean
                  description: Retry an expired request
      responses:
        '200':
          description: Wishlist item updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  wishlist_item:
                    $ref: '#/components/schemas/WishlistItem'
                  fairy_response:
                    type: string
        '400':
          description: Invalid update parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Wishlist item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /library/books:
    get:
      summary: Get user's library
      description: Retrieve user's downloaded and tracked books
      security:
        - BearerAuth: []
      parameters:
        - name: completion_status
          in: query
          description: Filter by completion status
          schema:
            type: string
            enum: [downloaded, started, completed, archived]
        - name: page
          in: query
          description: Page number for pagination
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Books per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: User's library
          content:
            application/json:
              schema:
                type: object
                properties:
                  library_items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LibraryItem'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  library_stats:
                    $ref: '#/components/schemas/LibraryStats'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /library/books/{library_item_id}:
    patch:
      summary: Update library item
      description: Update completion status, rating, or notes
      security:
        - BearerAuth: []
      parameters:
        - name: library_item_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                completion_status:
                  type: string
                  enum: [downloaded, started, completed, archived]
                user_rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                user_notes:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Library item updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  library_item:
                    $ref: '#/components/schemas/LibraryItem'
                  fairy_response:
                    type: string
        '400':
          description: Invalid update parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Library item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /library/notifications:
    get:
      summary: Get user's notifications
      description: Retrieve push notifications and in-app messages
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: query
          description: Filter by notification type
          schema:
            type: string
            enum: [download_complete, wishlist_promotion, new_author, system]
        - name: unread_only
          in: query
          description: Only return unread notifications
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Number of notifications to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: User's notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  unread_count:
                    type: integer

    patch:
      summary: Mark notifications as read
      description: Mark one or more notifications as read
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notification_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                mark_all_read:
                  type: boolean
                  description: Mark all notifications as read
      responses:
        '200':
          description: Notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated_count:
                    type: integer
                  message:
                    type: string

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    WishlistItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        book:
          $ref: '#/components/schemas/Book'
        requested_date:
          type: string
          format: date-time
        priority:
          type: integer
        status:
          type: string
          enum: [pending, processing, expired, fulfilled]
        expiration_date:
          type: string
          format: date-time
        queue_position:
          type: integer
        days_remaining:
          type: integer
          description: Days until expiration (negative if expired)
      required:
        - id
        - book
        - requested_date
        - status
        - expiration_date

    LibraryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        book:
          $ref: '#/components/schemas/Book'
        added_date:
          type: string
          format: date-time
        download_completed_date:
          type: string
          format: date-time
        completion_status:
          type: string
          enum: [downloaded, started, completed, archived]
        user_rating:
          type: integer
          minimum: 1
          maximum: 5
        user_notes:
          type: string
        recommendation_weight:
          type: number
          description: Weight used for recommendation algorithm
      required:
        - id
        - book
        - added_date
        - completion_status

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [download_complete, wishlist_promotion, new_author, system]
        title:
          type: string
        message:
          type: string
          description: Notification message in BookFairy's voice
        delivery_timestamp:
          type: string
          format: date-time
        read_status:
          type: boolean
        related_book:
          $ref: '#/components/schemas/Book'
        related_wishlist_item_id:
          type: string
          format: uuid
      required:
        - id
        - type
        - title
        - message
        - delivery_timestamp
        - read_status

    QueueInfo:
      type: object
      properties:
        total_items:
          type: integer
        pending_items:
          type: integer
        processing_items:
          type: integer
        expired_items:
          type: integer
        next_promotion_estimate:
          type: string
          description: Estimated time for next wishlist promotion
        available_slots:
          type: integer
          description: Current available download slots

    LibraryStats:
      type: object
      properties:
        total_books:
          type: integer
        completed_books:
          type: integer
        total_listening_hours:
          type: number
        favorite_genres:
          type: array
          items:
            type: string
        reading_streak_days:
          type: integer

    Book:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        narrator:
          type: string
        cover_image_url:
          type: string
          format: uri
        synopsis:
          type: string
        genre:
          type: array
          items:
            type: string
        duration_minutes:
          type: integer
        availability_status:
          type: string
          enum: [available, processing, unavailable]

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
        total_pages:
          type: integer
        total_items:
          type: integer
        items_per_page:
          type: integer
        has_next:
          type: boolean
        has_previous:
          type: boolean

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        fairy_message:
          type: string
      required:
        - error
        - message